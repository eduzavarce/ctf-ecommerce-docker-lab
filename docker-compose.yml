networks:
  dmz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.10.0/24
  priv-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.20.0/24

volumes:
  db_data:
    driver: local
    name: shop-db-data

services:
  reverse-proxy:
    image: nginx:1.30.6-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    container_name: shop-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/ssl/certs/servidor.crt:/etc/nginx/certs/servidor.crt:ro
      - /etc/ssl/private/servidor.key:/etc/nginx/certs/servidor.key:ro
    networks:
      - dmz-net
    depends_on:
      - web-01

  web-01:
    image: wordpress:7.1.3-php8.3-apache@sha256:8901759bfbb7ebc567dbc44a244c0d96d720d0a67c17bc4f42ec355ddba2e863
    container_name: shop-wordpress
    restart: unless-stopped
    depends_on:
      - db-01
    environment:
      WORDPRESS_DB_HOST: db-01:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - type: bind
        source: /srv/wordpress
        target: /var/www/html
    networks:
      - dmz-net
      - priv-net

  db-01:
    image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
    container_name: shop-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - priv-net
